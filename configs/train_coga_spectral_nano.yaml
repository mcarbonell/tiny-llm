# =====================================================================
# TinyThinker COGA Espectral — Validación Inicial
# Objetivo: Probar el ensamble completo COGA (Recurrencia + Scratchpad)
# usando la arquitectura matrix-free DCT/Walsh.
#
# Uso:
#   python scripts/train.py --config configs/train_coga_spectral_nano.yaml --arch coga_spectral --device cpu
# =====================================================================

# --- Dimensiones Base ---
dim: 256
n_heads: 8
n_kv_heads: 4
vocab_size: 16384
max_seq_len: 256

# --- COGA Layers & Recurrence ---
n_pre_layers: 1
n_core_layers: 2
n_post_layers: 1
max_recurrence_steps: 3
n_scratch_slots: 8

# --- MoE Params (para el Feed-Forward del Core) ---
n_experts: 4
top_k: 2
n_reserved: 1

# --- Parámetros Espectrales (Compresión Interna) ---
k_dim_attn: 64
k_dim_ffn: 64
k_hidden_ffn: 128

# --- Entrenamiento ---
batch_size: 16
seq_len: 256
max_iters: 5000
learning_rate: 0.001
min_lr: 0.00001
warmup_iters: 200
eval_interval: 250
eval_iters: 20
weight_decay: 0.1
grad_clip: 1.0
grad_accum_steps: 4
use_gradient_checkpointing: false

# --- Rutas ---
data_path: data/train_v1.bin
checkpoint_dir: checkpoints/coga_spectral_nano
tokenizer_path: model/tokenizer_v1.json
