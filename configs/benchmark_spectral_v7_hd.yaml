# =====================================================================
# TinyThinker Spectral V7 "Pure Spectral" — Dim 1024
# Objetivo: 100% Matrix-Free. Eliminar el impuesto al vocabulario.
# =====================================================================

# --- Dimensiones ---
dim: 1024
emb_dim: 128     # Factorización de Embeddings (V7)
n_layers: 6
n_heads: 16
n_kv_heads: 4
vocab_size: 32768
max_seq_len: 512

# --- Configuración Spectral V7 ---
k_vocab: 128     # Coeficientes para la Spectral Output Head (V7)
k_dim_attn: 128
k_dim_ffn: 128
k_hidden_ffn: 256
k_seq_len: 64

# --- Entrenamiento ---
batch_size: 8
seq_len: 512
max_iters: 10000
learning_rate: 0.001
min_lr: 0.00001
warmup_iters: 500
eval_interval: 250
eval_iters: 20
weight_decay: 0.1
grad_clip: 1.0
grad_accum_steps: 8

# --- Sistema ---
data_path: data/train_v2_32k.bin
checkpoint_dir: checkpoints/spectral_v7_hd_pure
tokenizer_path: model/tokenizer_v2_32k.json
arch: spectral_v7
optimizer: swo
device: cpu
