# =====================================================================
# SpectralThinker — Midi — EXP-4
# Objetivo: Escalar dim=512, k=128 sin weight tying
# Uso:
#   python scripts/train.py --config configs/train_spectral_midi.yaml --arch spectral_v4 --device cpu
# =====================================================================

# --- Dimensiones base ---
dim: 512
n_layers: 8
n_heads: 8
n_kv_heads: 4
vocab_size: 16384
max_seq_len: 256

# --- Parámetros espectrales ---
k_dim_attn: 128
k_dim_ffn: 128
k_hidden_ffn: 256

# --- Entrenamiento ---
batch_size: 16
seq_len: 256
max_iters: 5000
learning_rate: 0.001
min_lr: 0.00001
warmup_iters: 200
eval_interval: 250
eval_iters: 20
weight_decay: 0.1
grad_clip: 1.0
grad_accum_steps: 4
use_gradient_checkpointing: false

# --- Rutas ---
data_path: data/train_v1.bin
checkpoint_dir: checkpoints/spectral_midi
tokenizer_path: model/tokenizer_v1.json
